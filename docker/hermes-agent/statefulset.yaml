# Hermes agent StatefulSet (namespace: ai) — tracked manifest (HER-134,
# reconciled with the live object 2026-08-05, HER-206).
#
# This file is the durable source of truth for the hermes-agent StatefulSet.
# It references the wrapper image (docker/hermes-agent/Dockerfile), which
# bakes in the Playwright 1223 browser set so the browser cache survives pod
# deletion and image rebuilds (HER-134 durability guarantee). The wrapper
# image is built and loaded into the local k3s containerd via
# docker/hermes-agent/build-and-import.sh — this cluster has no in-cluster
# registry (HER-206 decision, option (a); see docker/hermes-agent/README.md).
#
# Reconciliation (HER-206, 2026-08-05): this file matches the live object —
# container command (hermes gateway run), envFrom configMapRef hermes-env,
# env (PYTHONPATH only), configMap volume hermes-config-vol →
# hermes-config-volume, PVC 10Gi, image hermes-agent-wrapper:1.60-browsers
# with imagePullPolicy IfNotPresent.
#
# SECURITY: the readiness probe in the live object carries a Bearer token
# (HER-134/HER-206 constraint: never commit or paste it). The probe below
# uses BEARER_TOKEN_PLACEHOLDER, which must be replaced at apply time from
# the live object. If the token ever leaks, rotate it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
  namespace: ai
  labels:
    app: hermes-agent
spec:
  serviceName: hermes-agent
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      containers:
        - name: hermes-agent
          # Wrapper image: upstream hermes-agent + Playwright 1223 browser set
          # baked into image layers (docker/hermes-agent/Dockerfile). Built and
          # imported into local k3s containerd via
          # docker/hermes-agent/build-and-import.sh (no in-cluster registry on
          # this cluster). Tag convention: <playwright-core major.minor>-browsers.
          image: hermes-agent-wrapper:1.60-browsers
          # IfNotPresent: the image is loaded locally into k3s containerd, never
          # pulled from a registry; re-importing the same tag does not re-pull,
          # so roll out a new tag deliberately (see README).
          imagePullPolicy: IfNotPresent
          command:
            - /opt/hermes/bin/hermes
            - gateway
            - run
          ports:
            - name: api
              containerPort: 8642
          # API key + agent config are injected from the hermes-env ConfigMap
          # (live convention — do not inline secrets here).
          envFrom:
            - configMapRef:
                name: hermes-env
          env:
            - name: PYTHONPATH
              value: /opt/data/pylibs
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: hermes-config-vol
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8642
              httpHeaders:
                - name: Authorization
                  # SECRET placeholder — replace with the live token at apply
                  # time (see file header). Do not commit the real token.
                  value: "Bearer BEARER_TOKEN_PLACEHOLDER"
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: hermes-config-vol
          configMap:
            name: hermes-config-volume
  # /opt/data (HERMES_HOME, agent workspaces) persists on this PVC across pod
  # deletion/recreation. Reconcile the storage request with the live object.
  volumeClaimTemplates:
    - metadata:
        name: hermes-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
