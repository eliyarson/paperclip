# Hermes agent StatefulSet (namespace: ai) — tracked manifest (HER-134).
#
# This file is the durable source of truth for the hermes-agent StatefulSet.
# Previously the object existed only as a kubectl last-applied annotation.
# It now references the wrapper image (docker/hermes-agent/Dockerfile), which
# bakes in the Playwright 1223 browser set so the browser cache survives pod
# deletion and image rebuilds.
#
# !!! READ BEFORE APPLYING !!!
# kubectl apply performs a three-way merge: fields present in the live object
# but ABSENT from this file are PRUNED. Before the first apply, reconcile this
# file against the live object and port over anything missing (env vars,
# probes, resources, tolerations, node selectors, etc.):
#
#   kubectl -n ai get sts hermes-agent -o yaml > /tmp/hermes-agent-live.yaml
#   diff -u /tmp/hermes-agent-live.yaml docker/hermes-agent/statefulset.yaml
#
# SECURITY: the readiness probe in the live object carries a Bearer token
# (HER-134 constraint: never commit or paste it). The probe below uses
# BEARER_TOKEN_PLACEHOLDER, which must be replaced at apply time from the live
# object. If the token ever leaks, rotate it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
  namespace: ai
  labels:
    app: hermes-agent
spec:
  serviceName: hermes-agent
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      containers:
        - name: hermes-agent
          # Wrapper image: upstream hermes-agent + Playwright 1223 browser set
          # baked into image layers (docker/hermes-agent/Dockerfile). Built and
          # pushed by .github/workflows/hermes-agent-wrapper.yml.
          image: 10.43.150.22:5000/hermes-agent:latest
          # :latest tag → pull on every (re)start so a re-pushed wrapper image
          # is picked up; pulls are LAN-speed from the in-cluster registry.
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 8642
          env:
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data
            - name: HERMES_DISABLE_LAZY_INSTALLS
              value: "1"
            - name: HERMES_LAZY_INSTALL_TARGET
              value: /opt/data/lazy-packages
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /opt/hermes/.playwright
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: hermes-config
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8642
              httpHeaders:
                - name: Authorization
                  # SECRET placeholder — replace with the live token at apply
                  # time (see file header). Do not commit the real token.
                  value: "Bearer BEARER_TOKEN_PLACEHOLDER"
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: hermes-config
          configMap:
            name: hermes-config
  # /opt/data (HERMES_HOME, agent workspaces) persists on this PVC across pod
  # deletion/recreation. Reconcile the storage request with the live object.
  volumeClaimTemplates:
    - metadata:
        name: hermes-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
